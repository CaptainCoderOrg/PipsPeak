<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIC-80 Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Silkscreen&display=swap">
<style>
/* The labs: TIC-80's editor and the teaching panels (wide, tall, or in the page). The
   course's own colors and fonts (coursekit/site.css), light and dark. */
:root {
  --bg: #eef1f7;
  --surface: #ffffff;
  --ink: #1a1c2c;
  --muted: #4b5b73;
  --line: #d3dae7;
  --accent: #3b5dc9;
  --accent-ink: #ffffff;
  --changed: #b13e53;
  --sun: #ffcd75;
  --sun-ink: #1a1c2c;
  --play: #257d45;
  --play-ink: #ffffff;
  --bar-off: #d3dae7;
  --bar-on: #3b5dc9;
  --bar-now: #ef7d57;
  --hl: #ffcd75;
  --font-display: "Silkscreen", "Courier New", monospace;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14151f;
    --surface: #1e2030;
    --ink: #eef1f7;
    --muted: #a9bccc;
    --line: #333c57;
    --accent: #41a6f6;
    --accent-ink: #14151f;
    --changed: #ef7d57;
    --bar-off: #333c57;
    --bar-on: #41a6f6;
    --bar-now: #ffcd75;
    --play: #38b764;
    --play-ink: #14151f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --play: #38b764;
  --play-ink: #14151f;
  --bg: #14151f;
  --surface: #1e2030;
  --ink: #eef1f7;
  --muted: #a9bccc;
  --line: #333c57;
  --accent: #41a6f6;
  --accent-ink: #14151f;
  --changed: #ef7d57;
  --bar-off: #333c57;
  --bar-on: #41a6f6;
  --bar-now: #ffcd75;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 1rem/1.5 var(--font-body);
  overflow-x: hidden;
}
.lab { max-width: 832px; margin: 0 auto; padding: 0 16px 1rem; }
/* inside the course page, the page's column has the margins */
.in-page .lab { max-width: none; padding: 0 0 1rem; }
h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; }
h1 { font-size: 1.15rem; }
h2 { font-size: 0.95rem; margin-bottom: 0.5rem; }
p { margin: 0.4rem 0; }
kbd {
  font: 0.85em var(--font-mono);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 0 0.3em; background: var(--surface);
}
code { font: 0.9em var(--font-mono); }

button { font: inherit; color: inherit; }
.btn {
  font: 700 0.9rem var(--font-body);
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 0.35rem 0.75rem; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--sun); color: var(--sun-ink); border-color: transparent; }
.btn.play { background: var(--play); color: var(--play-ink); border-color: transparent; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.btn.small { font-size: 0.8rem; padding: 0.15rem 0.5rem; }

/* the title row: the two editors as tabs, then the whole-cart buttons */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem;
  padding: 0.6rem 0;
}
.tabs { display: flex; gap: 0.25rem; }
.tab {
  font: 700 0.9rem var(--font-body);
  border: 1px solid var(--line); border-radius: 6px; background: transparent;
  padding: 0.3rem 0.7rem; cursor: pointer; color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.bar .actions { margin-left: auto; display: flex; gap: 0.5rem; }

/* TIC-80's picture: 256x144 with its border, filling a 16:9 box */
.screen {
  position: relative;
  aspect-ratio: 256 / 144;
  background: #1a1c2c;
  border-radius: 8px;
  overflow: hidden;
}
#canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  display: block; image-rendering: pixelated; touch-action: none; outline: none;
}
.screen:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #f4f4f4; font: 1rem var(--font-display); background: #1a1c2c; text-align: center; padding: 1rem;
}
/* the part of the editor a label is about */
.hl {
  position: absolute; pointer-events: none;
  border: 2px solid var(--hl); border-radius: 3px;
  box-shadow: 0 0 0 2px rgba(26, 28, 44, 0.7), 0 0 12px var(--hl);
}
.pointing {
  min-height: 3em; margin: 0.5rem 0 0.75rem; padding: 0.4rem 0.7rem;
  border-left: 4px solid var(--hl); background: var(--surface); border-radius: 0 6px 6px 0;
}
.pointing b { font-family: var(--font-display); font-weight: 400; }

.away {
  display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
  margin: 0 0 0.75rem; padding: 0.5rem 0.7rem; border-radius: 6px;
  background: var(--sun); color: var(--sun-ink);
}

.panels { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.75rem; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 0.75rem; min-width: 0;
}
.panel.wide { grid-column: 1 / -1; }
.hint { color: var(--muted); font-size: 0.9rem; }

/* the cart's sounds and songs, by name */
.chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.group-name { font-size: 0.85rem; color: var(--muted); margin: 0.5rem 0 0.25rem; }
.chip {
  display: inline-flex; align-items: center; gap: 0.35rem;
  border: 1px solid var(--line); border-radius: 999px; background: var(--bg);
  padding: 0.2rem 0.65rem 0.2rem 0.25rem; cursor: pointer; font-size: 0.9rem;
}
.chip .n {
  min-width: 1.6rem; text-align: center; border-radius: 999px; padding: 0 0.3rem;
  background: var(--line); font: 700 0.8rem var(--font-mono);
}
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] .n { background: rgba(255, 255, 255, 0.25); }
.chip.changed::after { content: "changed"; font-size: 0.7rem; font-weight: 700; color: var(--changed); }
.chip[aria-pressed="true"].changed::after { color: inherit; }

/* now playing: one bar per tick, as loud as that tick */
.ticks { display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 2px; align-items: end; height: 48px; margin: 0.5rem 0 0.2rem; }
.ticks i { display: block; background: var(--bar-off); border-radius: 1px; min-height: 2px; }
.ticks i.on { background: var(--bar-on); }
.ticks i.now { background: var(--bar-now); }
.ticks i.skip { opacity: 0.3; }
.tick-scale { display: flex; justify-content: space-between; font: 0.75rem var(--font-mono); color: var(--muted); }
.status { font-weight: 700; margin: 0.3rem 0; }
.status.playing { color: var(--play); }
.facts { margin: 0.4rem 0 0; padding-left: 1.1rem; }
.facts li { margin: 0.15rem 0; }
.row { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-top: 0.5rem; }

/* music: progress through the frame's rows */
.meter { height: 8px; background: var(--bar-off); border-radius: 4px; overflow: hidden; margin: 0.4rem 0; }
.meter i { display: block; height: 100%; width: 0; background: var(--bar-on); }

.channels { display: grid; gap: 0.4rem; }
.channel {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.5rem; align-items: center;
  padding: 0.35rem 0.5rem; border: 1px solid var(--line); border-radius: 6px;
}
.channel .num { font: 700 0.85rem var(--font-mono); width: 1.6rem; height: 1.6rem; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; background: var(--line); }
.channel.sounding .num { background: var(--play); color: var(--play-ink); }
.channel.off { border-style: dashed; }
.channel.off .num { background: transparent; border: 1px dashed var(--muted); }
.channel .what { font-size: 0.9rem; overflow-wrap: anywhere; }
.channel .what small { display: block; color: var(--muted); }
.channel .btns { display: flex; gap: 0.3rem; }
.channel .btn[aria-pressed="true"] { background: var(--changed); color: #fff; border-color: transparent; }

.changes { margin: 0.3rem 0; padding-left: 1.1rem; }
.changes li { margin: 0.2rem 0; }
.changes .btn { margin-left: 0.4rem; }

/* what each part of the editor is */
.legend { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.25rem 1rem; }
.legend button {
  display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px;
  padding: 0.3rem 0.4rem; cursor: pointer; font-size: 0.9rem;
}
.legend button:hover, .legend button.active { background: var(--bg); }
.legend button:focus-visible { background: var(--bg); outline: 2px solid var(--accent); outline-offset: 0; }
.legend b { font-family: var(--font-display); font-weight: 400; }

.saved-panel { margin: 0 0 0.75rem; border-color: var(--sun); border-width: 2px; }
.saved-panel ol { margin: 0.3rem 0; padding-left: 1.3rem; }

@media (max-width: 640px) {
  .panels, .legend { grid-template-columns: minmax(0, 1fr); }
  .bar .actions { margin-left: 0; }
}
[hidden] { display: none !important; }

details.panel > summary { cursor: pointer; list-style: none; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary h2 { display: inline; }
details.panel > summary::before { content: "▸ "; color: var(--accent); }
details.panel[open] > summary::before { content: "▾ "; }
details.panel > summary .hint { margin-left: 0.4rem; }
details.panel[open] > summary { margin-bottom: 0.5rem; }

/* the labs' panels stack with the same gap they have inside */
#editor-panels > .panels, #editor-panels + .panels { margin-top: 0.75rem; }

/* pictures: chips with a small picture, the big view (see-through shows as a checkerboard) */
.chip.pic { padding-left: 0.3rem; }
.chip canvas, .thumb { image-rendering: pixelated; display: block; }
.chip.pic canvas { width: 16px; height: 16px; }
.big-pic {
  display: block; width: 96px; height: 96px; image-rendering: pixelated; border-radius: 4px;
  background: repeating-conic-gradient(var(--line) 0% 25%, var(--surface) 0% 50%) 0 0 / 12px 12px;
  border: 1px solid var(--line);
}
.anim { display: flex; gap: 0.75rem; align-items: center; }
.dot { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 2px; border: 1px solid var(--line); margin: 0 0.25em 0 0.1em; vertical-align: -0.1em; }
.pic-change { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem; }
.pic-change canvas { width: 24px; height: 24px; image-rendering: pixelated; border: 1px solid var(--line); }
.swatches { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 0.3rem; }
.swatch { border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 0.2rem; cursor: pointer; }
.swatch .sw { display: block; height: 1.4rem; border-radius: 3px; border: 1px solid var(--muted); }
.swatch .n { display: block; font: 0.75rem var(--font-mono); text-align: center; }
.swatch.changed { border-color: var(--changed); border-width: 2px; }
.swatch:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* the map: levels, the whole world small, the cell under the mouse */
.levels { display: grid; gap: 0.35rem; margin-bottom: 0.6rem; }
.level { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.minimap { position: relative; width: 100%; max-width: 720px; aspect-ratio: 240 / 136; background: #1a1c2c; border-radius: 6px; overflow: hidden; }
.minimap canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; cursor: crosshair; }
.mm-level { position: absolute; border: 1px dashed rgba(255, 255, 255, 0.7); pointer-events: none; }
.mm-level span { position: absolute; left: 2px; top: 1px; font: 0.7rem var(--font-body); color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000; white-space: nowrap; }
.mm-view { position: absolute; border: 2px solid var(--hl); box-shadow: 0 0 0 1px #1a1c2c; pointer-events: none; }
.cell { display: flex; gap: 0.6rem; align-items: flex-start; }
.cell-pic { width: 48px; height: 48px; image-rendering: pixelated; border: 1px solid var(--line); flex: none; }
.cell .facts { margin: 0; }
.brush { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.6rem; font-size: 0.9rem; }
.cell-pic.small { width: 24px; height: 24px; }
.pics { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
.anim-text { font-size: 0.9rem; }
#reset-all.armed { background: var(--changed); color: #fff; border-color: transparent; }
.touch-note { margin: 0 0 0.6rem; padding: 0.4rem 0.7rem; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); font-size: 0.9rem; }
.lab.running .when-editing { visibility: hidden; }
.chip .tag { font: 700 0.65rem var(--font-body); letter-spacing: 0.02em; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 0.25rem; }
.chip[aria-pressed="true"] .tag { color: inherit; border-color: currentColor; }
.swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

/* Filling a window (lab-core.js fit()): the course page's dialog, or a window of its own.
   Wide: TIC-80 on the left, the panels on the right; tall: TIC-80 on top, the panels
   under it. The panels scroll on their own; TIC-80 stays in view. */
html.fill, html.fill body { height: 100%; overflow: hidden; }
html.fill .lab { max-width: none; height: 100%; padding: 0 16px; display: grid; column-gap: 16px; }
.lab.tall { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
.lab.wide { grid-template-columns: var(--screen-w) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
.lab.wide .bar { grid-column: 1 / -1; }
.lab.tall .stage { width: var(--screen-w); max-width: 100%; justify-self: center; }
.lab.wide .stage { min-height: 0; overflow-y: auto; }
html.fill .side { min-height: 0; overflow-y: auto; padding-bottom: 1rem; container-type: inline-size; }
@container (max-width: 600px) {
  .panels, .legend { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<main class="lab">
  <header class="bar" id="bar">
    <h1 id="title">TIC-80 Lab</h1>
    <div class="tabs" id="tabs" role="tablist" aria-label="Editor"></div>
    <div class="actions">
      <button type="button" class="btn play" id="try" disabled>▶ Try it in the game</button>
      <button type="button" class="btn" id="reset-all" disabled>Reset everything</button>
      <button type="button" class="btn primary" id="save" disabled>Save</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="screen" id="screen">
      <canvas id="canvas" tabindex="0" aria-label="TIC-80" oncontextmenu="event.preventDefault()"></canvas>
      <div class="loading" id="loading">Starting TIC-80…</div>
    </div>
    <p class="pointing" id="pointing"></p>
    <p class="away" id="away" hidden>
      <span id="away-text"></span>
      <button type="button" class="btn small" id="back">Back</button>
    </p>
  </div>

  <div class="side" id="side">
    <p class="touch-note" id="touch-note" hidden>On a phone or tablet you can look around, listen and tap the lists below;
      drawing, painting and typing work best with a mouse and keyboard.</p>

    <section class="panel saved-panel" id="save-help" hidden>
      <h2>Your changes in your game</h2>
      <div id="save-text"></div>
      <button type="button" class="btn small" id="save-close">OK, got it</button>
    </section>

    <div id="editor-panels"></div>

    <div class="panels">
      <details class="panel wide" id="legend-box">
        <summary><h2>What's on the screen</h2><span class="hint">every part of the editor, explained</span></summary>
        <ul class="legend" id="legend"></ul>
      </details>
    </div>
  </div>
</main>

// The labs: TIC-80's own editors (our web build of 1.3.1 with the lab's functions:
// tic80/build.sh lab, tic80/LAB.md) and, around them, panels that name what the
// cart holds, show what is happening and what changed, and put things back.
//   lab.html?cart=lesson15&mode=sfx|music|sprite|palette|map[&sprite=N][&fill=1][&handoff=1]
// fill=1: the course page shows it full screen (a dialog), not growing in the page;
// handoff=1: start from the cart the page hands over (the lab moved between windows).
// This file is the shared part. lab-sound.js, lab-sprite.js and lab-map.js each
// add editors with LAB.editor({...}), and LAB.start() runs last.
var LAB = (function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('lab-data').textContent);
  var HERO = DATA.hero || 'the player';      // the game's hero, by name (the project's course.HERO)
  var params = new URLSearchParams(location.search);

  var CART = /^[a-z0-9][a-z0-9-]{0,40}$/.test(params.get('cart') || '') ? params.get('cart') : 'lesson16';
  // the editors each lab has, the first one open at the start
  var FAMILIES = { sfx: [0, 1], music: [1, 0], sprite: [2], palette: [2], map: [3, 2] };
  var TITLES = { sfx: 'Sound Lab', music: 'Sound Lab', sprite: 'Sprite Lab', palette: 'Sprite Lab', map: 'Map Lab' };
  var MODE = FAMILIES[params.get('mode')] ? params.get('mode') : 'sfx';
  var FAMILY = FAMILIES[MODE];
  var CODE = (DATA.code || {})[CART] || {};   // what this lesson's code calls things
  // a cart with names of its own (a library cart): its sounds, songs and patterns
  var OWN = (DATA.cartNames || {})[CART];
  if (OWN) ['sfx', 'tracks', 'patterns'].forEach(function (k) { if (OWN[k]) DATA[k] = OWN[k]; });
  var IN_PAGE = window.parent !== window;
  // the lab fills its window (a dialog over the course page, a window of its own) and lays
  // itself out by its width; in the page's column (phones) it grows as tall as it is
  var FILL = !IN_PAGE || params.get('fill') === '1';
  var KEY = 'lab-' + CART + '-' + MODE;      // the lab's name for the course page (lab-embed.js)
  // the course page that opened it: the page it is in, or the window that opened its window
  var COURSE = (function () {
    try {
      var w = IN_PAGE ? window.parent : window.opener;
      return w && w.labEmbed ? w : null;
    } catch (e) { return null; }       // another site's page
  })();
  var TOUCH = Boolean(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  var GAME = 4, WORLD = 5;                   // lab_editor(): the cart running, the world view
  if (IN_PAGE) document.documentElement.classList.add('in-page');

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function button(cls, text, onClick) {
    var b = el('button', cls, text);
    b.type = 'button';
    if (onClick) b.addEventListener('click', onClick);
    return b;
  }
  function s8(v) { return v << 24 >> 24; }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
  function seconds(s) { return (Math.round(s * 100) / 100) + ' s'; }
  function ranges(list) {
    var out = [], i = 0;
    while (i < list.length) {
      var j = i;
      while (j + 1 < list.length && list[j + 1] === list[j] + 1) j++;
      out.push(j > i ? list[i] + '–' + list[j] : String(list[i]));
      i = j + 1;
    }
    return out.join(', ');
  }

  // TIC-80
  // ---------------------------------------------------------------------------
  var canvas = $('canvas');
  var M = null;                       // the module, once the studio is up
  var original = {};                  // the cart as loaded (PNG bytes); editors keep their own parts
  var cartBytes = fetch(CART + '.png').then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.arrayBuffer();
  }).then(function (b) { return new Uint8Array(b); });

  window.Module = {
    canvas: canvas,
    arguments: ['--skip'],
    onRuntimeInitialized: function () {
      var start = window.Module._sokol_start;
      window.Module._sokol_start = function () {
        // The studio reads its options when it starts: no CRT effect, and the
        // picture fills the 16:9 box (the labels rely on that).
        try {
          var dir = '/com.nesbox.tic/TIC-80/.local/62c24e5/', path = dir + 'options.json', opts = {};
          FS.mkdirTree(dir);
          try { opts = JSON.parse(FS.readFile(path, { encoding: 'utf8' })); } catch (e) { /* first run */ }
          opts.crt = false;
          opts.integerScale = false;
          FS.writeFile(path, JSON.stringify(opts));
        } catch (e) { /* the defaults, then */ }
        return start.apply(this, arguments);
      };
    }
  };

  // The console asks the site it runs on for a newer TIC-80 (tic80.com's /json?fn=version;
  // on the course's site a 404). The labs are 1.3.1 on purpose: the answer is "none".
  var xhrOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url) {
    var args = Array.prototype.slice.call(arguments);
    if (/\/json\?fn=version$/.test(String(url))) args[1] = 'data:application/json,{}';
    return xhrOpen.apply(this, args);
  };

  function heap() { return M.HEAPU8; }
  // the bytes behind one of the lab's pointer functions (lab_sfx_data, ...)
  function bytes(fn, size) { var p = M['_' + fn](); return heap().subarray(p, p + size); }
  function ram(addr) { return heap()[M._lab_ram() + addr]; }
  function withBytes(data, fn) {
    var p = M._malloc(data.length);
    heap().set(data, p);
    try { return fn(p, data.length); } finally { M._free(p); }
  }
  function loadCart(data) { withBytes(data, function (p, n) { M._lab_load(p, n); }); }
  function cString(text) { return new TextEncoder().encode(text + '\0'); }

  function resumeAudio() {
    var ctx = window.Module && window.Module._saudio_context;
    if (ctx && ctx.state !== 'running') ctx.resume().catch(function () {});
  }
  document.addEventListener('pointerdown', resumeAudio, true);
  document.addEventListener('keydown', resumeAudio, true);

  // While TIC-80 has the keyboard: Space and the arrows don't scroll the page, and Tab
  // (Shift+Tab where the editor uses Tab) still moves on to the page's buttons. These
  // run before TIC-80's own handlers: they are added before tic80.js loads.
  function tabOut(e) {
    var m = editors[state.editor];
    return e.key === 'Tab' && state.screen !== GAME && (e.shiftKey || !(m && m.usesTab));
  }
  window.addEventListener('keydown', function (e) {
    if (document.activeElement !== canvas) return;
    if (tabOut(e)) { e.stopImmediatePropagation(); return; }
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown'].indexOf(e.key) >= 0) e.preventDefault();
  }, true);
  window.addEventListener('keyup', function (e) {
    if (document.activeElement === canvas && tabOut(e)) e.stopImmediatePropagation();
  }, true);
  // the wheel scrolls the page, except over an editor that scrolls with it
  window.addEventListener('wheel', function (e) {
    var m = editors[state.editor];
    if (!(m && m.usesWheel) || state.screen === GAME) e.stopImmediatePropagation();
  }, { capture: true, passive: true });

  // ---------------------------------------------------------------------------
  // Pictures: tiles and sprites as the cart holds them (4 bits a pixel, 32 bytes a tile)
  // ---------------------------------------------------------------------------
  function pixel(tiles, id, x, y) {
    var b = tiles[id * 32 + y * 4 + (x >> 1)];
    return x & 1 ? b >> 4 : b & 15;
  }
  function color(palette, c) { return [palette[c * 3], palette[c * 3 + 1], palette[c * 3 + 2]]; }
  function hex(palette, c) {
    return '#' + color(palette, c).map(function (v) { return (v < 16 ? '0' : '') + v.toString(16); }).join('');
  }
  // a w x h block of tiles starting at id (as spr() reads them), into a canvas; color `key` is see-through
  function paint(cv, tiles, palette, id, w, h, scale, key) {
    w = w || 1; h = h || 1; scale = scale || 1;
    cv.width = 8 * w * scale;
    cv.height = 8 * h * scale;
    var ctx = cv.getContext('2d'), img = ctx.createImageData(cv.width, cv.height), d = img.data;
    for (var ty = 0; ty < h; ty++) {
      for (var tx = 0; tx < w; tx++) {
        var t = id + ty * 16 + tx;
        for (var y = 0; y < 8; y++) {
          for (var x = 0; x < 8; x++) {
            var c = pixel(tiles, t, x, y);
            if (c === key) continue;
            var rgb = color(palette, c);
            for (var sy = 0; sy < scale; sy++) {
              for (var sx = 0; sx < scale; sx++) {
                var o = (((ty * 8 + y) * scale + sy) * cv.width + (tx * 8 + x) * scale + sx) * 4;
                d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = 255;
              }
            }
          }
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    return cv;
  }
  // what the course's game makes of a sprite flag in this lesson: [name, meaning, lesson],
  // or null before the lesson just ahead of the one that starts using it
  // (a course whose lab_code lists the flags the cart's code reads, CODE.flags, uses those)
  function flagMeaning(bit, lesson) {
    var f = DATA.flags[bit];
    if (f && CODE.flags) return CODE.flags.indexOf(bit) >= 0 ? f : null;
    if (!f || lesson < f[2] - 1) return null;
    // a flag set in this lesson for the next one: this lesson's game doesn't look at it yet
    return lesson < f[2] ? [f[0], 'nothing yet in this lesson\'s game; from lesson ' + f[2] + ', ' + f[1], f[2]] : f;
  }
  // A marker tile, in words: the level loader (CODE.spawn: tile -> "new_coin", "start",
  // "new_platform:left and right") replaces it when a level starts. level: the level the
  // cell is in, for what goes in its place (its back wall, or nothing).
  function marker(id, level) {
    var what = (CODE.spawn || {})[id];
    if (!what) return null;
    var how = what.split(':'), fn = how[0];
    var words = fn === 'start' ? 'where ' + HERO + ' starts' : (DATA.markers || {})[fn] || fn.replace(/^new_/, 'a ').replace(/_/g, ' ');
    if (how[1]) words += ', moving ' + how[1];
    var bg = level ? level.bg : null;
    var after = bg === null ? 'the level\'s background' : bg ? 'tile ' + bg + ' (' + (DATA.art[bg] || 'the back wall') + ')' : 'nothing';
    return '<b>A marker: ' + words + '.</b> When the level starts, <code>load_level()</code> ' +
      (fn === 'start' ? 'puts ' + HERO + ' here' : 'calls <code>' + fn + '</code>, which puts the real thing here') +
      ', and the cell gets ' + after + ' instead: the marker tile itself is never drawn in the game.';
  }
  function tileEmpty(tiles, id) {
    for (var k = 0; k < 32; k++) if (tiles[id * 32 + k]) return false;
    return true;
  }

  // ---------------------------------------------------------------------------
  // Editors
  // ---------------------------------------------------------------------------
  var editors = {};      // id -> what lab-sound.js, lab-sprite.js, lab-map.js register
  var state = { screen: -2, editor: -1, last: FAMILY[0], pointed: null };

  function editor(module) {
    module.view = {};
    editors[module.id] = module;
  }
  function inLab(id) { return FAMILY.indexOf(id) >= 0 && editors[id] && editors[id].available; }
  // the lab's editor for what TIC-80 shows: the world view belongs to the map
  function labEditor(screen) {
    var id = screen === WORLD ? 3 : screen;
    return inLab(id) ? id : -1;
  }

  // A click with the mouse leaves the keyboard with TIC-80; a key press on a button
  // leaves it on the button.
  function open(id, focus) {
    M._lab_sfx_play(0);   // let go of a Space the lab holds, or the next editor would get it
    M._lab_open(id);
    if (editors[id].opened) editors[id].opened();
    if (focus) canvas.focus({ preventScroll: true });
  }
  function ensure(id) { if (labEditor(M._lab_editor()) !== id || M._lab_editor() === WORLD) open(id, false); }

  // ---------------------------------------------------------------------------
  // What each part of the editor is: the pointing line, the outlines, the list
  // ---------------------------------------------------------------------------
  var highlights = [];
  function highlight(rects) {
    highlights.forEach(function (h) { h.remove(); });
    highlights = (rects || []).map(function (r) {
      var h = el('div', 'hl');
      h.style.left = ((8 + r[0]) / 256 * 100) + '%';
      h.style.top = ((4 + r[1]) / 144 * 100) + '%';
      h.style.width = (r[2] / 256 * 100) + '%';
      h.style.height = (r[3] / 144 * 100) + '%';
      $('screen').appendChild(h);
      return h;
    });
  }
  function parts() {
    var m = editors[state.editor];
    return m ? (typeof m.parts === 'function' ? m.parts(state.screen) : m.parts) : [];
  }
  function point(part) {
    var p = $('pointing'), m = editors[state.editor];
    if (!part) { p.innerHTML = m ? m.hint(TOUCH, state.screen) : ''; return; }
    p.innerHTML = '';
    p.appendChild(el('b', null, part.name));
    p.appendChild(document.createTextNode(': ' + part.text));
  }
  function partAt(sx, sy) {
    var m = editors[state.editor];
    if (m && m.partAt) {
      var special = m.partAt(sx, sy, state.screen);
      if (special) return special;
    }
    var list = parts();
    for (var i = 0; i < list.length; i++) {
      for (var k = 0; k < list[i].rects.length; k++) {
        var r = list[i].rects[k];
        if (sx >= r[0] && sx < r[0] + r[2] && sy >= r[1] && sy < r[1] + r[3]) return list[i];
      }
    }
    return null;
  }
  canvas.addEventListener('mousemove', function (e) {
    if (!M || state.editor < 0) return;
    var box = canvas.getBoundingClientRect();
    var sx = (e.clientX - box.left) / box.width * 256 - 8, sy = (e.clientY - box.top) / box.height * 144 - 4;
    var m = editors[state.editor];
    if (m.pointer) m.pointer(sx, sy, state.screen);
    var part = partAt(sx, sy);
    if (part !== state.pointed) { state.pointed = part; point(part); }
  });
  canvas.addEventListener('mouseleave', function () {
    var m = editors[state.editor];
    if (m && m.pointer) m.pointer(null, null, state.screen);
    state.pointed = null;
    point(null);
  });

  function buildLegend() {
    var ul = $('legend');
    ul.innerHTML = '';
    parts().forEach(function (part) {
      var li = el('li'), b = button(null);
      b.appendChild(el('b', null, part.name));
      b.appendChild(document.createTextNode(': ' + part.text));
      function on() { b.classList.add('active'); highlight(part.rects); point(part); }
      function off() { b.classList.remove('active'); highlight(null); point(state.pointed); }
      b.addEventListener('mouseenter', on);
      b.addEventListener('mouseleave', off);
      b.addEventListener('focus', on);
      b.addEventListener('blur', off);
      li.appendChild(b);
      ul.appendChild(li);
    });
  }
  // without a mouse to point with, the list of parts is the way to learn them
  if (TOUCH) $('legend-box').open = true;

  // ---------------------------------------------------------------------------
  // What TIC-80 shows: one of the lab's editors, the game, or somewhere else
  // ---------------------------------------------------------------------------
  function screenChanged(screen) {
    var id = labEditor(screen), away = id < 0;
    state.screen = screen;
    $('away').hidden = !away;
    $('away-text').textContent = screen === GAME
      ? 'The game is running, with your changes. ' + (TOUCH ? 'Tap the game to show its buttons. ' : 'Play it with ' + (CODE.keys || 'the arrow keys') + '. ') +
        (CODE.gameNote ? CODE.gameNote + ' ' : '') + 'Press Esc (or Back) to come back to the editor.'
      : 'You left the lab\'s editors (that\'s fine: this is the whole TIC-80).';
    document.querySelector('.lab').classList.toggle('running', screen === GAME);
    $('back').textContent = screen === GAME ? 'Back to the editor' : 'Back to the ' + TITLES[MODE];
    $('pointing').hidden = away;
    document.querySelectorAll('.tab').forEach(function (t) {
      t.setAttribute('aria-selected', String(Number(t.getAttribute('data-editor')) === id));
    });
    if (away) {
      M._lab_sfx_play(0);
      highlight(null);
      return;
    }
    state.editor = id;
    state.last = id;
    document.querySelectorAll('.panels[data-for]').forEach(function (p) {
      p.hidden = Number(p.getAttribute('data-for')) !== id;
    });
    $('save').textContent = editors[id].save.label;
    state.pointed = null;
    highlight(null);
    point(null);
    buildLegend();
    editors[id].view = {};
  }

  $('back').addEventListener('click', function (e) { open(state.last, byMouse(e)); });

  // The game, from the start, or with some Lua run in it once it has started (a
  // level to begin at). The keyboard goes to TIC-80: that's how you play.
  var runs = 0;
  function run(lua) {
    var token = ++runs;
    M._lab_sfx_play(0);
    M._lab_run();
    canvas.focus({ preventScroll: true });
    $('screen').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    if (!lua) return;
    var code = cString(lua), tries = 0;
    (function later() {
      // the cart's Lua starts on its first tick; until then there is nothing to run code in
      if (token !== runs || M._lab_editor() !== GAME || tries++ > 120) return;
      var ok = tries > 5 && withBytes(code, function (p) { return M._lab_eval(p); });
      if (!ok) requestAnimationFrame(later);
    })();
  }
  $('try').addEventListener('click', function () { run(null); });

  // ---------------------------------------------------------------------------
  // The loop, reset and save
  // ---------------------------------------------------------------------------
  var lastSlow = 0;
  function refresh() { lastSlow = 0; }

  function frame(now) {
    try {
      var screen = M._lab_editor();
      if (screen !== state.screen) screenChanged(screen);
      var slow = now - lastSlow > 250;
      if (slow) lastSlow = now;
      var m = editors[labEditor(screen)];
      if (m) m.update(slow, screen);
    } finally {
      requestAnimationFrame(frame);
    }
  }

  var resetArmed = null;
  $('reset-all').addEventListener('click', function () {
    var btn = this;
    // one click arms it, a second one within a few seconds resets: a slip of the mouse loses nothing
    if (!resetArmed) {
      btn.textContent = 'Click again to reset everything';
      btn.classList.add('armed');
      resetArmed = setTimeout(function () { resetArmed = null; btn.textContent = 'Reset everything'; btn.classList.remove('armed'); }, 5000);
      return;
    }
    clearTimeout(resetArmed);
    resetArmed = null;
    btn.textContent = 'Reset everything';
    btn.classList.remove('armed');
    // loading the cart again starts the editors over: keep what they showed
    var kept = FAMILY.filter(inLab).map(function (id) { return [id, editors[id].keep ? editors[id].keep() : null]; });
    M._lab_music_stop();
    loadCart(original.cart);
    kept.forEach(function (k) { if (editors[k[0]].restore) editors[k[0]].restore(k[1]); });
    open(state.last, false);
    Object.keys(editors).forEach(function (id) { editors[id].view = {}; });
    refresh();
  });

  function download(data, name) {
    var a = el('a');
    a.href = URL.createObjectURL(new Blob([data], { type: 'image/png' }));
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
  }

  // What the saved cart is, and the console commands that copy parts of it into
  // your own game (`load <file> <part>`: only that part changes, but all of it).
  function saveHelp(save, note) {
    $('save-help').hidden = false;
    $('save-help').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    if (note) { $('save-text').innerHTML = '<p>' + note + '</p>'; return; }
    var name = save.file;
    $('save-text').innerHTML =
      '<p><b>' + name + '</b> is a whole TIC-80 cart: this lesson\'s game with your changes. To put ' + save.what +
      ' into your own game:</p><ol>' +
      '<li>Copy <b>' + name + '</b> into TIC-80\'s folder (type <code>folder</code> in TIC-80\'s console to open it).</li>' +
      '<li>Load your game, then type ' + save.parts.map(function (p) {
        return '<code>load ' + name + ' ' + p[0] + '</code> for ' + p[1];
      }).join(', or ') + '. Only that part changes, so your code stays as it is. But all of that part changes: ' +
      'anything you made yourself in it is replaced by this cart\'s.</li>' +
      '<li>Type <code>save</code> (or press <kbd>Ctrl</kbd>+<kbd>S</kbd>) to save your game.</li></ol>';
  }

  // In the course page, the page offers the file (in the claude.ai viewer, through its
  // downloads) and says how it went; a page that doesn't answer isn't the course.
  var pendingSave = null;
  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (e.source !== window.parent || !pendingSave || !msg || msg.type !== 'lab-saved') return;
    var job = pendingSave;
    pendingSave = null;
    clearTimeout(job.timer);
    if (msg.ok) saveHelp(job.save);
    else if (msg.reason === 'declined') saveHelp(job.save, 'Not saved: the download was cancelled. Click Save again whenever you like.');
    else { download(job.data, job.save.file); saveHelp(job.save); }
  });

  $('save').addEventListener('click', function () {
    var size = withBytes(original.cart, function (p, n) { return M._lab_save_png(p, n); });
    var data = heap().slice(M._lab_saved(), M._lab_saved() + size);
    var save = editors[state.last].save;
    if (!IN_PAGE) { download(data, save.file); saveHelp(save); return; }
    if (pendingSave) clearTimeout(pendingSave.timer);
    pendingSave = { data: data, save: save, timer: setTimeout(function () {
      pendingSave = null;
      download(data, save.file);
      saveHelp(save);
    }, 60000) };

  });
  $('save-close').addEventListener('click', function () { $('save-help').hidden = true; });

  // ---------------------------------------------------------------------------
  // The layout. Filling a window: wide (TIC-80 on the left, as large as the height allows,
  // the panels on the right) or tall (TIC-80 on top, the panels under it); the panels
  // scroll on their own. TIC-80's picture is a whole number of screen pixels a pixel.
  // A window too small for either (a phone), or the lab in the page's column: the page
  // scrolls, and in the page the course page sizes the frame to fit the lab.
  // ---------------------------------------------------------------------------
  var lab = document.querySelector('.lab'), layout = '';
  function fit() {
    var W = document.documentElement.clientWidth, H = window.innerHeight;
    var bar = $('bar').getBoundingClientRect().height, below = 84;  // the pointing line under it
    // whole device pixels for each of TIC-80's: 256 x 144 with its border
    var dpr = window.devicePixelRatio || 1;
    function scale(maxW, maxH) {
      var s = Math.min(maxW / 256, maxH / 144) * dpr;
      return s >= 2 ? Math.floor(s) : s;
    }
    var wide = scale(W - 32 - 16 - 340, H - bar - below - 8), tall = scale(W - 32, (H - bar - below) * 0.6);
    // wide from about 1100 pixels, unless TIC-80 would be smaller than stacked
    var next = !FILL || W < 700 || H < 460 ? 'flow' : W >= 1100 && wide >= tall ? 'wide' : 'tall';
    if (next !== layout) {
      layout = next;
      document.documentElement.classList.toggle('fill', next !== 'flow');
      lab.classList.toggle('wide', next === 'wide');
      lab.classList.toggle('tall', next === 'tall');
    }
    if (next === 'flow') { lab.style.removeProperty('--screen-w'); return; }
    lab.style.setProperty('--screen-w', Math.max(256, Math.floor(256 * (next === 'wide' ? wide : tall)) / dpr) + 'px');
  }

  if (window.ResizeObserver) new ResizeObserver(function () { fit(); }).observe($('bar'));

  if (IN_PAGE && !FILL && window.ResizeObserver) {
    var sent = 0;
    new ResizeObserver(function () {
      var h = Math.ceil(lab.getBoundingClientRect().height);
      if (h !== sent) { sent = h; window.parent.postMessage({ type: 'lab-height', height: h }, '*'); }
    }).observe(lab);
  }

  // The course page hides the lab's dialog (the lab stays as it is): quiet while hidden.
  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (e.source !== window.parent || !msg || !M) return;
    if (msg.type === 'lab-pause') {
      M._lab_sfx_play(0);
      M._lab_music_stop();
      // the game may still be playing: the sound goes off (sokol_audio turns a suspended
      // context back on by itself, through onstatechange, so that waits until it shows again)
      var ctx = window.Module._saudio_context;
      if (ctx && ctx.state === 'running') {
        ctx.labStateChange = ctx.onstatechange;
        ctx.onstatechange = null;
        ctx.suspend().catch(function () {});
      }
    }
    if (msg.type === 'lab-resume') {
      var c = window.Module._saudio_context;
      if (c && c.labStateChange) { c.onstatechange = c.labStateChange; c.labStateChange = null; }
      resumeAudio();
    }
  });

  // ---------------------------------------------------------------------------
  // Moving between windows: the course page takes the cart as it is now (with the
  // changes) from one copy of the lab and hands it to the next, which starts from it.
  // ---------------------------------------------------------------------------
  function handoff() {
    if (!M || !original.cart || $('reset-all').disabled) return null;
    var size = withBytes(original.cart, function (p, n) { return M._lab_save_png(p, n); });
    return {
      cart: heap().slice(M._lab_saved(), M._lab_saved() + size),
      editor: state.last,
      kept: FAMILY.filter(inLab).map(function (id) { return [id, editors[id].keep ? editors[id].keep() : null]; })
    };
  }
  function takeHandoff() {
    if (params.get('handoff') !== '1' || !COURSE) return null;
    try { return COURSE.labEmbed.take(KEY); } catch (e) { return null; }
  }
  // In a window of its own: the course page learns it is here, also after it reloads.
  if (!IN_PAGE && window.opener) {
    setInterval(function () {
      try {
        if (window.opener && !window.opener.closed && window.opener.labEmbed) window.opener.labEmbed.attach(KEY, window);
      } catch (e) { /* the opener went somewhere else */ }
    }, 1000);
  }

  // ---------------------------------------------------------------------------
  // Start: TIC-80, then the cart, then the editors
  // ---------------------------------------------------------------------------
  function begin(data) {
    M = window.Module;
    original.cart = data;
    loadCart(data);
    FAMILY.forEach(function (id) { if (editors[id]) editors[id].init(); });   // each sets .available
    var tabs = $('tabs'), first = -1;
    FAMILY.forEach(function (id) {
      if (!inLab(id)) return;
      if (first < 0) first = id;
      var t = button('tab', editors[id].tab, function (e) { open(id, byMouse(e)); });
      t.setAttribute('role', 'tab');
      t.setAttribute('data-editor', String(id));
      tabs.appendChild(t);
      var panels = el('div', 'panels');
      panels.setAttribute('data-for', String(id));
      panels.hidden = true;
      $('editor-panels').appendChild(panels);
      editors[id].build(panels);
    });
    if (first < 0) { $('loading').textContent = 'This cart has nothing for this lab yet.'; return; }
    state.last = first;
    FAMILY.forEach(function (id) { if (inLab(id) && editors[id].start) editors[id].start(params); });
    var given = takeHandoff();
    if (given) {

    for (k = 0; k < m.length; k++) h = (h * 31 + m[k]) | 0;
    var s = 0;
    for (k = 0; k < t.length; k++) s = (s * 31 + t[k]) | 0;
    for (k = 0; k < p.length; k++) s = (s * 31 + p[k]) | 0;
    for (k = 0; k < f.length; k++) s = (s * 31 + f[k]) | 0;
    spriteKey = s;
    return h + ':' + s;
  }

  function update(slow, screen) {
    var view = MAP.view;
    if (slow) {
      var key = dataKey();
      if (key !== view.data) {
        view.data = key;
        drawMinimap();
        renderChanges();
        hover.key = null;
      }
      // a click paints without moving the mouse: say what the cell holds now
      if (hover.at) MAP.pointer(hover.at[0], hover.at[1], screen);
    }
    var x = M._lab_map_x(), y = M._lab_map_y();
    var vkey = [x, y, screen].join();
    if (vkey !== view.scroll) {
      view.scroll = vkey;
      place($('mm-view'), x / 8, y / 8, 30, 17);
      var l = levelAt(Math.floor(x / 8) + 15, Math.floor(y / 8) + 8);
      $('map-where').textContent = screen === L.WORLD
        ? 'The world map is open: click a place in it to go there.'
        : 'The editor shows cells ' + Math.floor(x / 8) + '-' + (Math.floor(x / 8) + 29) + ' across and ' + Math.floor(y / 8) + '-' +
          (Math.floor(y / 8) + 16) + ' down' + (l ? ', in ' + l.name : '') + '.';
    }
    renderBrush();
  }

  var MAP = {
    id: 3, tab: 'Map',
    usesTab: true,                  // Tab: the world view
    parts: function (screen) { return screen === L.WORLD ? WORLD_PARTS : PARTS; },
    // over the map: the cell, in a line under the screen; over the open tile sheet: the sheet
    partAt: function (sx, sy, screen) {
      if (screen !== 3 || sy < 8) return null;
      if (M._lab_map_sheet()) {
        return sx >= 111 ? { name: 'Tile sheet', text: 'click a tile to paint with it; drag across several to paint a block of them. Shift (or the icon at the top right) closes it.' } : null;
      }
      var c = cellAt(sx, sy), id = map()[c[1] * W + c[0]], l = levelAt(c[0], c[1]), f = flags()[id], what = [];
      for (var b = 0; b < 8; b++) {
        var m = (f & (1 << b)) ? flagMeaning(b) : null;
        if (m) what.push(m[0] + ': ' + m[1]);
      }
      var mk = (CODE.spawn || {})[id];
      return { name: 'Map cell (' + c[0] + ', ' + c[1] + ')', text: (id ? 'tile ' + id + ' · ' + name(id) : 'empty') +
        (l ? ', in ' + l.name : '') + (mk ? '. A marker (see Under the mouse)' : '') + (what.length ? '. ' + what.join('; ') : '') + '.' };
    },
    save: { label: 'Save my map', file: 'my-map.png', what: 'your map',
      parts: [['map', 'the map'], ['tiles', 'the tiles it is made of'], ['flags', 'their flags']] },
    hint: function (touch, screen) {
      if (screen === L.WORLD) return 'This is the world map: the whole map, small. Click a place to go there; Tab goes back.';
      return touch
        ? 'Tap a level in the list below to go there. <b>What\'s on the screen</b>, further down, says what each part of the editor does. Painting works best with a mouse.'
        : 'Point at the map to find out what is in a cell. Pick a level below to go there; open the tile sheet (the last icon at the top right) to pick a tile, then click to paint.';
    },
    // the cell under the mouse, said in words
    pointer: function (sx, sy, screen) {
      var box = $('map-hover');
      var off = sx === null || screen !== 3 || sy < 8 || M._lab_map_sheet();
      box.hidden = off;
      $('map-hover-hint').hidden = !off;
      hover.at = sx === null ? null : [sx, sy];
      if (off) { hover.key = null; return; }
      hover.el = $('map-hover-cell');
      var c = cellAt(sx, sy);
      renderCell(hover, c[0], c[1]);
    },
    init: function () {
      M = L.M();
      orig.map = map().slice();
      MAP.available = false;
      for (var i = 0; i < CELLS; i++) if (orig.map[i]) { MAP.available = true; break; }
      findArea();
    },
    build: function (panels) {
      panels.innerHTML =
        '<section class="panel wide"><h2>The cart\'s levels</h2>' +
        '<p class="hint">Click a level to go there in the map editor' + (CODE.play ? ', or play it.' : '.') + '</p>' +
        '<div id="level-list" class="levels"></div>' +
        '<div class="minimap" id="minimap-box"><canvas id="minimap" width="240" height="136" ' +
        'aria-label="The whole map: click to go there"></canvas></div>' +
        '<p class="hint when-editing" id="map-where"></p></section>' +
        '<section class="panel"><h2>Under the mouse</h2>' +
        '<div id="map-hover" hidden><div id="map-hover-cell" class="cell"></div></div>' +
        '<p class="hint" id="map-hover-hint">Point at the map in the editor: this says what is in that cell.</p>' +
        '<div class="brush" id="map-brush"></div></section>' +
        '<section class="panel"><h2>What you changed</h2><div id="map-changes"></div></section>';
      buildLevels();
    },
    start: function () {
      if (LEVELS.length) M._lab_map_scroll(LEVELS[0].x * 8, LEVELS[0].y * 8);
      // the editor starts with tile 0, which paints empty cells: start with grass instead
      var t = L.tileEmpty(tiles(), 2) ? 1 : 2;
      if (!L.tileEmpty(tiles(), t)) M._lab_map_set_tile(t);
    },
    update: update,
    keep: function () { return [M._lab_map_x(), M._lab_map_y()]; },
    restore: function (k) { M._lab_map_scroll(k[0], k[1]); }
  };

  L.editor(MAP);
})(LAB);
LAB.start();
</script>
</body>
</html>
